<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>DFWGV Planner</title>
  <meta name="title" content="DFWGV Planner" />
  <meta name="description" content="DFW Gaming Village game day planning. Host tables, join games, and manage waitlists across Discord and the web." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://dfwgamingvillage.com/planner/" />
  <meta property="og:title" content="DFWGV Planner" />
  <meta property="og:description" content="DFW Gaming Village game day planning. Host tables, join games, and manage waitlists across Discord and the web." />
  <meta property="og:image" content="https://dfwgamingvillage.com/planner/banner2.png" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://dfwgamingvillage.com/planner/" />
  <meta property="twitter:title" content="DFWGV Planner" />
  <meta property="twitter:description" content="DFW Gaming Village game day planning. Host tables, join games, and manage waitlists across Discord and the web." />
  <meta property="twitter:image" content="https://dfwgamingvillage.com/planner/banner2.png" />

  <meta name="theme-color" content="#0a0a0e" />

  <link rel="icon" href="./dfwgv-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600;700;800&display=swap" />

  <!-- styles.css is shared with Events and Admin; planner.css is this page's layout. -->
  <link rel="stylesheet" href="./styles.css?v=20261024-d1" />
  <link rel="stylesheet" href="./planner.css?v=20261024-d2" />
</head>
<body class="plannerD">
  <a class="skipLink" href="#main">Skip to tables</a>

  <header class="top">
    <div class="topIn wrap gutter">
      <a class="brandLink" href="https://www.dfwgamingvillage.com/" aria-label="DFW Gaming Village home">
        <img src="./dfwgv-icon.png" alt="" />
        <span>DFWGV Planner</span>
      </a>
      <nav class="links" aria-label="Planner navigation">
        <a class="link" href="./" aria-current="page">Planner</a>
        <a class="link" href="./events/">Events</a>
        <a class="link" href="/vgplanner/">Video games</a>
        <a class="link" href="./admin/" data-admin-link hidden>Admin</a>
      </nav>
      <div class="topRight" id="authbar">
        <span class="sr" id="authStatus" aria-live="polite">Loading…</span>
        <button class="btn btn-primary btn-small" id="btnSignIn" style="display:none;">Sign in</button>
        <button class="btn btn-quiet btn-icon bell" id="btnInbox" style="display:none;" aria-label="Notifications">
          <svg class="ico ico-lg" aria-hidden="true"><use href="#i-bell"/></svg>
          <span class="badge" id="inboxBadge" hidden>0</span>
        </button>
        <div class="menuWrap" id="acctWrap" hidden>
          <button class="acctBtn" id="btnAccount" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">
            <span class="av av-lg" id="acctAvatar" aria-hidden="true"></span>
          </button>
          <div class="menu" id="acctMenu" role="menu" hidden>
            <div class="mwho"><b id="acctName"></b><span id="acctRole"></span></div>
            <hr />
            <button class="mi" id="btnMyEvents" role="menuitem"><svg class="ico" aria-hidden="true"><use href="#i-cal"/></svg>My profile and events</button>
            <button class="mi" id="btnNickname" role="menuitem"><svg class="ico" aria-hidden="true"><use href="#i-pencil"/></svg>Change nickname</button>
            <button class="mi" id="btnHostGuide" role="menuitem" style="display:none;"><svg class="ico" aria-hidden="true"><use href="#i-book"/></svg>Host guide</button>
            <button class="mi" id="btnBecomeHost" role="menuitem" style="display:none;"><svg class="ico" aria-hidden="true"><use href="#i-shield"/></svg><span>Request organizer access</span></button>
            <hr />
            <button class="mi danger" id="btnSignOut" role="menuitem"><svg class="ico" aria-hidden="true"><use href="#i-logout"/></svg>Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game days: a row of date tickets on wide screens, a "Change" list on phones. -->
  <nav class="rail" id="gdRail" aria-label="Game days"></nav>
  <nav class="gdPicker" id="gdPicker" aria-label="Game days"></nav>

  <section class="evHero" id="gamedayCard" hidden>
    <div class="evBg" id="evBg" aria-hidden="true"></div>
    <div class="ev wrap gutter">
      <div class="evKicker" id="gdKicker"></div>
      <h1 id="gamedayTitle">Game Day</h1>
      <div class="evRow">
        <div class="evMeta" id="gamedayMeta"></div>
        <div class="evActs">
          <div class="evActsDyn" id="gdActs"></div>
          <button class="btn" id="btnWantToPlay"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-hand"/></svg>Request a Game</button>
          <button class="btn btn-primary" id="btnHostTable"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-plus"/></svg>Host a Table</button>
        </div>
      </div>
      <div class="evStats" id="gdStats"></div>
    </div>
  </section>

  <main id="main" class="layout wrap gutter">
    <section class="tablesSec" aria-labelledby="tTitle">
      <div id="dayTabs"></div>
      <div class="agHead"><div><h2 id="tTitle">Tables</h2><p id="tSub"></p></div></div>
      <div class="slots"><div id="tablesList" class="dayGrid">
        <div class="skeletonCard" aria-hidden="true"></div>
        <div class="skeletonCard" aria-hidden="true"></div>
      </div></div>
    </section>

    <aside class="aside" id="gdAside">
      <section class="sideCard" aria-labelledby="ydTitle">
        <div class="cardHead"><h2 id="ydTitle">Your day</h2><span class="count num" id="ydCount"></span></div>
        <div id="yourDay"></div>
      </section>
      <section class="sideCard" aria-labelledby="rqTitle">
        <div class="cardHead"><h2 id="rqTitle">Requested games</h2><span class="count num" id="wantsCount"></span></div>
        <div id="wantsList"></div>
      </section>
    </aside>
  </main>

  <!-- Table details: a sheet from the right (full screen on phones). -->
  <div class="sheetScrim" id="sheetScrim" hidden></div>
  <aside class="sheet" id="tableSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheetBody" id="sheetBody"></div>
  </aside>

  <div class="modal" id="modal" style="display:none;">
    <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modalHead">
        <h3 id="modalTitle">Modal</h3>
        <button class="btn" id="btnModalClose" aria-label="Close modal">Close</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="./app.js?v=20261024-d2"></script>
  <script src="../site-analytics.js?v=20260611-planner"></script>
</body>
</html>
