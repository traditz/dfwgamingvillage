<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signing in — DFWGV Planner</title>
  <meta name="theme-color" content="#0a0a0e" />
  <link rel="icon" href="../dfwgv-icon.png" />
  <style>
    /* Shown for a moment between Discord and the planner, so it stays
       self-contained: no web fonts, no shared stylesheet. */
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
      background: #0a0a0e; color: #f1f2f5;
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .card {
      width: min(380px, 100%); display: grid; justify-items: center; gap: 14px; padding: 32px 24px;
      border: 1px solid rgba(255, 255, 255, .07); border-radius: 18px; background: #16161d; text-align: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px -12px rgba(0, 0, 0, .7);
    }
    .card img { width: 34px; height: 44px; object-fit: contain; }
    h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .muted { color: #9a9ba7; }
    .muted a { color: #f87171; }
    .spin {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .12); border-top-color: #d32f34;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
</head>
<body>
  <main class="card">
    <img src="../dfwgv-icon.png" alt="" />
    <h1>DFWGV Planner</h1>
    <div class="spin" aria-hidden="true"></div>
    <div class="muted" role="status">Completing sign-in and taking you back to the planner…</div>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const oauthError = params.get("error");

      // User cancelled (or Discord errored): explain instead of silently bouncing.
      if (oauthError && !code) {
        document.querySelector(".spin")?.remove();
        document.querySelector(".muted").innerHTML =
          'Sign-in was cancelled — no worries. <a href="/planner/">Back to the planner</a>.';
        return;
      }

      // Enforce same-origin on the stored return URL. new URL(absolute, base)
      // ignores the base, so the origin must be checked explicitly.
      const returnToRaw = sessionStorage.getItem("discord_return_to") || "/planner/";
      let returnTo = new URL(returnToRaw, window.location.origin);
      if (returnTo.origin !== window.location.origin) {
        returnTo = new URL("/planner/", window.location.origin);
      }

      if (code) returnTo.searchParams.set("code", code);
      if (state) returnTo.searchParams.set("state", state);

      // Hand off to app.js on the planner page
      window.location.replace(returnTo.toString());
    })();
  </script>
</body>
</html>
